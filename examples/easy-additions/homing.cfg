# Original written by Viesturs Zarins
# Modified by Justin F. Hallett
# Modified more by Jared Wellman

[gcode_macro homing_override_config]
variable_sensorless_x: 
variable_sensorless_y: 
variable_homing_rebound_y: 20
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.49
gcode: 


[homing_override]
axes: xyz
gcode:
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
  {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set home_x = home_all or 'X' in params %}
  {% set home_y = home_x or 'Y' in params %}
  {% set home_z = home_all or 'Z' in params %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set axis_min = printer.toolhead.axis_minimum %}
  {% set axis_max = printer.toolhead.axis_maximum %}

  {% set config = printer["gcode_macro homing_override_config"] %}

  # Z is homed at the bed center, getting there needs X and Y to be homed.
  {% if home_z and not ((home_x or 'x' in homed) and (home_y or 'y' in homed)) %}
    { action_raise_error("Must home X and Y axes first") }
  {% endif %}

  INITIALIZE_TOOLCHANGER
  ENTER_DOCKING_MODE
  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

  # Skew correction adds X/Y motion to the single axis moves below, while those
  # axes are not homed yet. Load the skew profile again once homing is done.
  {% if printer.skew_correction is defined %}
    SET_SKEW CLEAR=1
    {% if printer.skew_correction.current_profile_name %}
      { action_respond_info("Skew correction is disabled by homing, run SKEW_PROFILE LOAD=%s to enable it again." % (printer.skew_correction.current_profile_name,)) }
    {% endif %}
  {% endif %}

  G90 ; absolute mode
  {% if 'z' not in homed %}
    # Only Z gets a temporary position, X and Y keep their real homing state.
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    G0 Z10 F1000
  {% elif printer.toolhead.position[2]|float < 10 %}
    G0 Z10 F1000
  {% endif %}

  {% if home_y %}
    {% set position_endstop_y = printer.configfile.config["stepper_y"]["position_endstop"]|float %}
    # Rebound away from the endstop, whichever end of the axis it is on.
    {% set rebound_dir_y = -1 if position_endstop_y > (axis_min[1] + axis_max[1]) / 2 else 1 %}
    {% if config.sensorless_y %}
      _SENSORLESS_HOME AXIS=Y
    {% else %}
      G28 Y
    {% endif %}
    G0 Y{ position_endstop_y + rebound_dir_y * config.homing_rebound_y } F6000
  {% endif %}

  {% if home_x %}
    {% set position_endstop_x = printer.configfile.config["stepper_x"]["position_endstop"]|float %}
    {% set rebound_dir_x = -1 if position_endstop_x > (axis_min[0] + axis_max[0]) / 2 else 1 %}
    {% if config.sensorless_x %}
      _SENSORLESS_HOME AXIS=X
    {% else %}
      G28 X
    {% endif %}
    G0 X{ position_endstop_x + rebound_dir_x * 10 } F6000
  {% endif %}

  EXIT_DOCKING_MODE

  {% if home_z %}
    {% set random_x = (range(-50, 50) | random) / 10 %}
    {% set random_y = (range(-50, 50) | random) / 10 %}

    G90 ; absolute mode
    G0 X{( max_x / 2 ) + random_x} Y{( max_y / 2 ) + random_y} F12000
    G28 Z

    G0 Z10 F1000
  {% elif 'z' not in homed %}
    # Z was not homed, forget the temporary position used for the hop.
    SET_KINEMATIC_POSITION SET_HOMED=Z CLEAR_HOMED=Z
  {% endif %}
  M400


[gcode_macro _SENSORLESS_HOME]
gcode:
  {% set axis = params.AXIS|default('X')|string %}
  {% set config = printer["gcode_macro homing_override_config"] %}

  # Always use consistent run_current on A/B steppers during sensorless homing
  {% set RUN_CURRENT_X = printer.configfile.settings[config.stepper_driver ~ ' stepper_x'].run_current|float %}
  {% set RUN_CURRENT_Y = printer.configfile.settings[config.stepper_driver ~ ' stepper_y'].run_current|float %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={config.homing_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={config.homing_current}
  {% if config.stepper_driver ~ ' stepper_x1' in printer.configfile.settings %}
    {% set RUN_CURRENT_X1 = printer.configfile.settings[config.stepper_driver ~ ' stepper_x1'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT=0.1
  {% endif %}
  {% if config.stepper_driver ~ ' stepper_y1' in printer.configfile.settings %}
    {% set RUN_CURRENT_Y1 = printer.configfile.settings[config.stepper_driver ~ ' stepper_y1'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT=0.1
  {% endif %}

  # Home
  G28 {axis|upper}
    
  # Wait just a second… (give StallGuard registers time to clear)
  G4 P1000
  # Set current during print
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
  {% if config.stepper_driver ~ ' stepper_x1' in printer.configfile.settings %}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={RUN_CURRENT_X1}
  {% endif %}
  {% if config.stepper_driver ~ ' stepper_y1' in printer.configfile.settings %}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={RUN_CURRENT_Y1}
  {% endif %}
